name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      library_ref:
        description: "Optional gac-connect Git ref to test from this repository owner's fork"
        required: false
        type: string
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            ha: "2025.2.0"
          - python: "3.14"
            ha: "2026.6.2"
          - python: "3.14"
            ha: "2026.10.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Home Assistant and test tools
        run: python -m pip install 'homeassistant==${{ matrix.ha }}' 'pytest>=9,<10' 'ruff>=0.16,<0.17'
      - name: Install the exact manifest dependency
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          manifest = json.loads(Path('custom_components/gac_connect/manifest.json').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['requirements']])
          PY
      - name: Test the pinned library with its compatibility adapter
        run: python -m pytest -q --library-backend=pinned
      - name: Check out an optional library candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.library_ref != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gac-connect
          ref: ${{ inputs.library_ref }}
          path: library-candidate
      - name: Build and install the optional candidate artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.library_ref != '' }}
        run: |
          python tools/sync_capabilities.py --source library-candidate/src/gac_connect/capabilities.py --check
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/gac-candidate-wheel" ./library-candidate
          python -m pip install "$RUNNER_TEMP"/gac-candidate-wheel/gac_connect-*.whl
      - name: Test the candidate without integration overrides
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.library_ref != '' }}
        run: python -m pytest -q --library-backend=native
      - name: Static checks
        run: ruff check custom_components tests tools
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
