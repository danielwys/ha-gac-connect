name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            ha: "2025.2.0"
          - python: "3.14"
            ha: "2026.6.2"
          - python: "3.14"
            ha: "2026.10.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant and test tools
        run: python -m pip install 'homeassistant==${{ matrix.ha }}' 'pytest>=9,<10' 'ruff>=0.16,<0.17'
      - name: Install the exact manifest requirements
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          manifest = json.loads(Path('custom_components/gac_connect/manifest.json').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['requirements']])
          PY
      - name: Verify bundled source provenance
        run: python tools/vendor_library.py --check
      - name: Test the shipped library and integration together
        run: python -m pytest -q
      - name: Static checks
        run: ruff check custom_components tests tools
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
