# Example dashboard for GAC Connect — core Home Assistant cards only, no extra
# installs needed.
#
# HOW TO USE
#   1. Your entity IDs start with your vehicle's name. This example uses
#      `aion_v` (an "AION V"). If yours differ, find-and-replace `aion_v` with
#      your prefix (Developer Tools → States, filter "gac" or your model).
#   2. Dashboards → + Add Dashboard → New dashboard → open it → Edit (pencil) →
#      three-dot menu → Raw configuration editor → replace everything with this.
#
# TYRE PRESSURE IN PSI: the car reports kPa; to see psi, open a tyre sensor →
# settings (gear) → Unit of measurement → psi. Home Assistant converts it.
#
# LOCATION: the "Where" tile and the map both need the location tracker. Turn it
# on in Settings → Devices & Services → GAC Connect → Configure → Enable
# location tracking. With it off the tracker entity is not created at all, so
# delete both cards (or the whole Location section) to avoid an error tile.
#
# CHARGE WINDOW: Charging schedule shows the reported mode, window and days in
# its details. Configure → Charging schedule displays these readings and offers
# a form for sending a new window. Reported clock times may differ from the
# library's regional scheduling zone; verify in the car or official app.
#
# NOT EVERY CAR REPORTS EVERYTHING: a reading your car never sends usually shows
# as Unknown; Unavailable means the integration could not update at all. Delete
# any tile your car does not support.
#
# FRIDGE: only cars with a fridge / warmer box have the Fridge section's
# entities; delete the section if yours does not. The on/off tile and the mode
# buttons send commands to the car; the temperature buttons do too while the
# fridge runs (while it is off they only save the temperature for the next
# start). The keep-running setting is changed in the car; its two tiles only
# report it.
#
# TRIPS & CONSUMPTION: GAC's API has no trip figures, so the Trips &
# consumption section needs the sensors from docs/example-trips.yaml, which
# Home Assistant counts itself. Without that file, delete the section.
#
# NO REMOTE COMMANDS: if you would rather the dashboard could not send anything
# to the car, delete the Controls section AND, in Charging, the "Charge now" tile AND, in Fridge, the Fridge, Mode and
# Temperature tiles — those send commands too.
#
# Layout: `type: sections` with 3 columns. Each section is small so Home
# Assistant balances them; on a narrow screen they stack.

views:
  - title: Car
    path: car
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Battery
            icon: mdi:battery-high
          - type: gauge
            entity: sensor.aion_v_battery
            name: State of charge
            needle: true
            severity: { green: 60, yellow: 30, red: 0 }
          - type: tile
            entity: sensor.aion_v_range
            name: Range
          - type: tile
            entity: sensor.aion_v_odometer
            name: Odometer
          - type: tile
            entity: sensor.aion_v_last_report
            name: Last report
            # The timestamp that came with the latest vehicle status. Individual
            # readings may be older than it.

      - type: grid
        cards:
          - type: heading
            heading: Vehicle updates
            icon: mdi:update
          - type: tile
            entity: sensor.aion_v_data_freshness
            name: Vehicle report
          - type: tile
            entity: sensor.aion_v_last_cloud_refresh
            name: Last cloud refresh
          - type: tile
            entity: sensor.aion_v_last_command
            name: Last command
          - type: tile
            entity: sensor.aion_v_polling_status
            name: Polling
          - type: tile
            entity: button.aion_v_refresh
            name: Refresh
            tap_action: { action: toggle }

      - type: grid
        cards:
          - type: heading
            heading: Trips & consumption
            icon: mdi:road-variant
            # GAC's API does not provide these. Home Assistant counts the
            # kilometres from the odometer and estimates consumption from the
            # battery level; see docs/example-trips.yaml.
          - type: tile
            entity: sensor.aion_v_km_this_week
            name: This week
            icon: mdi:calendar-week
          - type: tile
            entity: sensor.aion_v_km_this_month
            name: This month
            icon: mdi:calendar-month
          - type: tile
            entity: sensor.aion_v_km_this_year
            name: This year
            icon: mdi:calendar
          - type: tile
            entity: sensor.aion_v_odometer
            name: Overall
            icon: mdi:counter
          - type: tile
            entity: sensor.aion_v_consumption_this_week
            name: Avg this week
            icon: mdi:lightning-bolt-outline
          - type: tile
            entity: sensor.aion_v_consumption_this_month
            name: Avg this month
            icon: mdi:lightning-bolt-outline
          - type: tile
            entity: sensor.aion_v_consumption_this_year
            name: Avg this year
            icon: mdi:lightning-bolt-outline
          - type: tile
            entity: sensor.aion_v_consumption_overall
            name: Avg overall
            icon: mdi:lightning-bolt
            # Note: all four averages are Home Assistant's estimate from
            # battery-level drops, not the car's figure, and include energy
            # used while parked.

      - type: grid
        cards:
          - type: heading
            heading: Charging
            icon: mdi:ev-station
          - type: tile
            entity: binary_sensor.aion_v_plugged_in
            name: Plug
          - type: tile
            entity: binary_sensor.aion_v_charging
            name: Charging
          - type: tile
            entity: binary_sensor.aion_v_charger_lock
            name: Charger lock
          - type: tile
            entity: sensor.aion_v_charging_schedule
            name: Charging mode and schedule
            tap_action: { action: more-info }
          - type: markdown
            content: >-
              Reported window:
              {{ state_attr('sensor.aion_v_charging_schedule', 'reported_start') or 'Not reported' }}
              to {{ state_attr('sensor.aion_v_charging_schedule', 'reported_stop') or 'Not reported' }}.
              {{ state_attr('sensor.aion_v_charging_schedule', 'reported_days') or 'Days not reported' }}.
              These times use the service's reported clock. To send a new window,
              open GAC Connect → Configure → Charging schedule.
          - type: tile
            entity: sensor.aion_v_estimated_charge_time
            name: Charge time
          - type: conditional
            conditions:
              - entity: binary_sensor.aion_v_charging
                state: "on"
            card:
              type: tile
              entity: sensor.aion_v_charge_power
              name: Charging at
          - type: conditional
            conditions:
              - entity: binary_sensor.aion_v_charging
                state: "on"
            card:
              type: tile
              entity: sensor.aion_v_charge_current
              name: Current
          - type: conditional
            conditions:
              - entity: binary_sensor.aion_v_charging
                state: "on"
            card:
              type: tile
              entity: sensor.aion_v_charge_voltage
              name: Voltage
          - type: tile
            entity: button.aion_v_charge_now
            name: Charge now
            tap_action: { action: toggle }

      - type: grid
        cards:
          - type: heading
            heading: History
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.aion_v_battery
                name: Battery
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.aion_v_range
                name: Range
          - type: history-graph
            hours_to_show: 48
            entities:
              - entity: binary_sensor.aion_v_plugged_in
                name: Plugged in
              - entity: binary_sensor.aion_v_charging
                name: Charging

      - type: grid
        cards:
          - type: heading
            heading: Controls
            icon: mdi:car-cog
          - type: tile
            entity: switch.aion_v_pre_conditioning
            name: A/C
          - type: thermostat
            entity: climate.aion_v_climate
            name: Pre-conditioning
            features:
              - type: climate-hvac-modes
                hvac_modes: [off, heat_cool]
          - type: tile
            entity: lock.aion_v_doors
            name: Doors
            # Unlock is available with Allow remote unlocking enabled in setup
            # or the integration options. No PIN required.
          - type: tile
            entity: cover.aion_v_windows
            name: Windows
            features:
              - type: cover-open-close
          - type: tile
            entity: cover.aion_v_sunroof
            name: Sunroof
            features:
              - type: cover-open-close
          - type: tile
            entity: cover.aion_v_tailgate
            name: Tailgate
            features:
              - type: cover-open-close
          - type: tile
            entity: switch.aion_v_steering_wheel_heat
            name: Steering heat
          - type: tile
            entity: switch.aion_v_ventilation
            name: Ventilation
          - type: tile
            entity: switch.aion_v_flash_lights
            name: Flash lights
          - type: tile
            entity: button.aion_v_sound_horn
            name: Horn
          - type: tile
            entity: button.aion_v_precondition_battery
            name: Warm the battery
            tap_action: { action: toggle }
            # Conditions the pack before fast charging in the cold.
          - type: tile
            entity: button.aion_v_refresh
            name: Refresh
            tap_action: { action: toggle }
            # Requests a fresh cloud status even during quiet hours, subject to
            # request limits. Whether this wakes the car depends on the backend.

      - type: grid
        cards:
          - type: heading
            heading: Fridge
            icon: mdi:fridge-outline
            # Only cars with a fridge / warmer box have these; delete this section
            # if yours does not.
          - type: tile
            entity: switch.aion_v_fridge
            name: Fridge
          - type: tile
            entity: select.aion_v_fridge_mode
            name: Mode
            features:
              - type: select-options
          - type: tile
            entity: number.aion_v_fridge_temperature
            name: Temperature
            features:
              - type: numeric-input
                style: buttons
          # The keep-running setting is changed in the car; these only report it.
          - type: tile
            entity: sensor.aion_v_fridge_after_leaving
            name: After leaving
          - type: tile
            entity: sensor.aion_v_fridge_time_left
            name: Time left
            # only meaningful with a timed setting
            visibility:
              - condition: state
                entity: sensor.aion_v_fridge_after_leaving
                state: timed

      - type: grid
        cards:
          - type: heading
            heading: Security & climate
            icon: mdi:shield-car
          - type: tile
            entity: binary_sensor.aion_v_lock
            name: Locks
          - type: tile
            entity: binary_sensor.aion_v_door
            name: Doors
          - type: tile
            entity: binary_sensor.aion_v_window
            name: Windows
          - type: tile
            entity: binary_sensor.aion_v_boot
            name: Boot
          - type: tile
            entity: sensor.aion_v_cabin_temperature
            name: Cabin
          - type: tile
            entity: sensor.aion_v_cabin_pm2_5
            name: Cabin air quality
          - type: tile
            entity: sensor.aion_v_12v_battery
            name: 12V

      - type: grid
        cards:
          - type: heading
            heading: Tyres
            icon: mdi:car-tire-alert
          - type: tile
            entity: sensor.aion_v_tyre_1_pressure
            name: Tyre 1
          - type: tile
            entity: sensor.aion_v_tyre_2_pressure
            name: Tyre 2
          - type: tile
            entity: sensor.aion_v_tyre_3_pressure
            name: Tyre 3
          - type: tile
            entity: sensor.aion_v_tyre_4_pressure
            name: Tyre 4
          - type: history-graph
            hours_to_show: 168
            entities:
              - entity: sensor.aion_v_tyre_1_temperature
                name: Tyre 1
              - entity: sensor.aion_v_tyre_2_temperature
                name: Tyre 2
              - entity: sensor.aion_v_tyre_3_temperature
                name: Tyre 3
              - entity: sensor.aion_v_tyre_4_temperature
                name: Tyre 4
            # Only cars whose cloud service reports tyre measurements can show
            # values here. Compare distinct readings with the car's wheel diagram
            # to confirm corners before renaming tiles; IDs alone are unverified.

      - type: grid
        cards:
          - type: heading
            heading: Location
            icon: mdi:map-marker
          - type: tile
            entity: binary_sensor.aion_v_online
            name: Online
            # "Off" usually means the car is asleep, not that it is unreachable.
          - type: tile
            entity: device_tracker.aion_v_location
            name: Where
          - type: map
            entities:
              - device_tracker.aion_v_location
            hours_to_show: 0
            aspect_ratio: "1:1"
